name: Test

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Bullfrog
        uses: ./.github/actions/bullfrog
        with:
          # Defaults plus the GitHub release domains foundry-toolchain downloads from,
          # and the public archive RPCs the mainnet-fork tests use: drpc is the in-repo
          # default, the tenderly gateway is the CI fallback below (drpc's free tier
          # rate-limits shared runner IPs). When setting the MAINNET_RPC_URL secret,
          # allow its domain too.
          allowed-domains: |
            registry.npmjs.org
            nodejs.org
            github.com
            api.github.com
            raw.githubusercontent.com
            objects.githubusercontent.com
            release-assets.githubusercontent.com
            eth.drpc.org
            mainnet.gateway.tenderly.co

      - name: Set up pnpm
        uses: pnpm/action-setup@91ab88e2619ed1f46221f0ba42d1492c02baf788 # v6.0.6

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Provides the anvil binary required by @iris-credit/test's vitest suite
      - name: Set up Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1

      - name: Install
        run: pnpm install --frozen-lockfile

      # tsc --noEmit (typecheck) + cjs/esm compile across all packages
      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test
        env:
          # Optional dedicated RPC for mainnet-fork tests; unset falls back to the tenderly
          # public gateway (drpc, the in-repo default, rate-limits shared runner IPs).
          MAINNET_RPC_URL: ${{ secrets.MAINNET_RPC_URL || 'https://mainnet.gateway.tenderly.co' }}
