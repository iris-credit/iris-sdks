name: Publish

# Auto-publishes @iris-credit/core-sdk and @iris-credit/iris-ts to public npm via
# OIDC Trusted Publishing (no token), on every merge to main that changes packages/.
# Versioning is intentionally throwaway (0.0.<run_number>) — consumers track the
# `latest` tag. Adopt changesets/semver when the API stabilizes.
on:
  push:
    branches: [main]
    paths:
      - "packages/**"

permissions:
  contents: read
  id-token: write # OIDC identity for token-free Trusted Publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@91ab88e2619ed1f46221f0ba42d1492c02baf788 # v6.0.6

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          scope: "@iris-credit"
          cache: pnpm

      # Trusted Publishing (OIDC) needs npm >= 11.5.1; the Node-bundled npm 10.x
      # can't reliably self-upgrade to latest, so pin a known-good npm 11 release.
      - run: npm install -g npm@11.11.0

      - run: pnpm install --frozen-lockfile

      - run: pnpm -r build

      # Stamp a unique, monotonically increasing version on every package so the
      # registry never rejects a duplicate. Both publishable packages get the same
      # version (lockstep), so core-sdk's `workspace:^` peer on iris-ts resolves.
      - name: Stamp version
        run: pnpm -r exec npm version "0.0.${{ github.run_number }}" --no-git-tag-version --allow-same-version

      # No token: authenticates to npm via GitHub OIDC (Trusted Publishing).
      - name: Publish
        run: pnpm -r publish --no-git-checks --access public
