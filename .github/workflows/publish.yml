name: Publish

# Changesets-based release flow for @iris-credit/*, publishing to public npm
# via OIDC Trusted Publishing (no token; provenance attaches automatically on
# a public repo). On every push to main the changesets action either:
#  - has pending changesets → opens/updates the "chore: version packages"
#    Version PR (version bumps + CHANGELOG entries), or
#  - has none (a Version PR just merged) → builds, publishes the bumped
#    packages, pushes one git tag per package, and creates matching GitHub
#    Releases.
# NOTE: npm Trusted Publishing is bound to this workflow's filename — renaming
# publish.yml requires updating the trusted publisher config on npmjs.com for
# every package.
on:
  workflow_dispatch: # allow manual re-runs (e.g. to recover a failed publish)
  push:
    branches: [main]

permissions:
  contents: write # push git tags + create GitHub Releases
  pull-requests: write # open/update the Version PR
  id-token: write # OIDC identity for token-free Trusted Publishing

# Serialize runs so a publish is never raced by the next merge.
concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      HUSKY: 0 # the action's version commit must not trigger pre-commit hooks
    steps:
      # Full history so the action can diff changesets and push tags; default
      # credential persistence is required for its git pushes.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@91ab88e2619ed1f46221f0ba42d1492c02baf788 # v6.0.6

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          scope: "@iris-credit"
          cache: pnpm

      # Trusted Publishing (OIDC) needs npm >= 11.5.1; the Node-bundled npm 10.x
      # can't reliably self-upgrade to latest, so pin a known-good npm 11 release.
      - run: npm install -g npm@11.11.0

      - run: pnpm install --frozen-lockfile

      - name: Version PR or publish
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          version: pnpm changeset version
          publish: pnpm release
        env:
          # Read by the action (PR/release management) and by
          # @changesets/changelog-github (PR metadata for CHANGELOG links).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
